! ==============================================================================
! RETAIL STORE NETWORK INFRASTRUCTURE SIMULATION
! DEVICE: SW-SERVER (Cisco Catalyst 3750-X / 2960 Layer 2 Access Switch)
! ROLE: Dedicated Access Switch for Retail Data Center / Server Farm
! LOCATION: MDF Server Room - Rack 2
! ==============================================================================

version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname SW-SERVER
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0  ! 'cisco123'
!
no ip domain-lookup
ip domain-name retail.internal
ip ssh version 2
!
username admin privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
! ==============================================================================
! VLAN DEFINITIONS
! ==============================================================================
vlan 30
 name SERVER-FARM
!
vlan 99
 name MANAGEMENT-SVI
!
vlan 666
 name NATIVE-BLACKHOLE
!
! ==============================================================================
! ACCESS PORTS (RETAIL SERVERS FA0/1 - FA0/10)
! ==============================================================================
interface FastEthernet0/1
 description Primary Active Directory & DNS Server [SRV-AD-DNS]
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 duplex full
 speed 100
 no shutdown
!
interface FastEthernet0/2
 description Centralized DHCP Server [SRV-DHCP]
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 duplex full
 speed 100
 no shutdown
!
interface FastEthernet0/3
 description Retail Database & ERP Server [SRV-RETAIL-DB]
 switchport mode access
 switchport access vlan 30
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 duplex full
 speed 100
 no shutdown
!
interface range FastEthernet0/4 - 24
 description Expansion Server Ports - VLAN 30
 switchport mode access
 switchport access vlan 30
 shutdown
!
! ==============================================================================
! TRUNK UPLINK TO SW-CORE
! ==============================================================================
interface GigabitEthernet0/1
 description Uplink to SW-CORE [Gi0/4]
 switchport mode trunk
 switchport trunk native vlan 666
 switchport trunk allowed vlan 30,99
 switchport nonegotiate
 duplex full
 speed 1000
 no shutdown
!
interface GigabitEthernet0/2
 description UNUSED GIGABIT UPLINK
 switchport mode access
 switchport access vlan 666
 shutdown
!
! ==============================================================================
! SWITCH MANAGEMENT SVI
! ==============================================================================
interface Vlan99
 description SW-SERVER Management Interface
 ip address 192.168.99.5 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
! ==============================================================================
! BANNER & ACCESS LINES
! ==============================================================================
banner motd ^C
*******************************************************************************
* WARNING: RESTRICTED ACCESS - RETAIL SERVER FARM ACCESS SWITCH (SW-SERVER)   *
* High-security zone hosting POS databases and corporate active directory.    *
*******************************************************************************
^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
 transport input none
!
line vty 0 4
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
