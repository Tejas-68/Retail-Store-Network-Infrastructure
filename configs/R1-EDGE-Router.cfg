! ==============================================================================
! RETAIL STORE NETWORK INFRASTRUCTURE SIMULATION
! DEVICE: R1-EDGE (Cisco 2911 / 4321 Integrated Services Router)
! ROLE: Edge Gateway, Router-on-a-Stick (802.1Q Inter-VLAN), DHCP, NAT/PAT & ACLs
! LOCATION: Main Distribution Frame (MDF) - Server Room Rack 1
! NOTICE: Fictional dummy IP addresses (RFC 1918 / 5737). No company data disclosed.
! ==============================================================================

version 15.4
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname R1-EDGE
!
boot-start-marker
boot-end-marker
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0  ! Encrypted password 'cisco123'
!
no ip domain-lookup
ip domain-name retail.internal
!
! --- CRYPTO KEY & SSH CONFIGURATION ---
! crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
username admin privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
! ==============================================================================
! DHCP SERVER EXCLUDED ADDRESSES (Static Servers, Gateways & Reserved IPs)
! ==============================================================================
ip dhcp excluded-address 192.168.10.1 192.168.10.10     ! VLAN 10 Gateway & Reserved
ip dhcp excluded-address 192.168.10.51 192.168.10.254   ! VLAN 10 Unused Static Space
ip dhcp excluded-address 192.168.20.1 192.168.20.50     ! VLAN 20 Gateway & VIPs
ip dhcp excluded-address 192.168.20.201 192.168.20.254  ! VLAN 20 Static Admin Reserved
ip dhcp excluded-address 192.168.30.1 192.168.30.254   ! VLAN 30 Statically Assigned Server Farm
ip dhcp excluded-address 192.168.40.1 192.168.40.10     ! VLAN 40 Gateway & Infrastructure
ip dhcp excluded-address 192.168.40.51 192.168.40.254   ! VLAN 40 Reserved
ip dhcp excluded-address 192.168.99.1 192.168.99.254   ! VLAN 99 Out-Of-Band Management
!
! ==============================================================================
! DHCP SCOPES FOR RETAIL ENDPOINTS
! ==============================================================================
ip dhcp pool POS_POOL
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.30.10 8.8.8.8
 domain-name retail.internal
 lease 0 12 0
!
ip dhcp pool STAFF_POOL
 network 192.168.20.0 255.255.255.0
 default-router 192.168.20.1
 dns-server 192.168.30.10 8.8.8.8
 domain-name retail.internal
 lease 1 0 0
!
ip dhcp pool PRINTER_POOL
 network 192.168.40.0 255.255.255.0
 default-router 192.168.40.1
 dns-server 192.168.30.10
 lease 7 0 0
!
! ==============================================================================
! ACCESS CONTROL LISTS (ACLs) - SEGMENTATION & PCI-DSS ENFORCEMENT
! ==============================================================================
! ACL 101: Filter incoming traffic from POS Terminals (VLAN 10)
ip access-list extended ACL_POS_IN
 remark === PERMIT POS TO DATABASE / ERP SERVICES ===
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.30.12 eq 1433
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.30.12 eq 443
 remark === PERMIT POS TO CORE DNS / NTP / DHCP SERVICES ===
 permit udp 192.168.10.0 0.0.0.255 host 192.168.30.10 eq domain
 permit tcp 192.168.10.0 0.0.0.255 host 192.168.30.10 eq domain
 permit udp 192.168.10.0 0.0.0.255 host 192.168.30.10 eq 123
 permit udp any eq bootpc any eq bootps
 remark === PERMIT PRINT JOBS TO RECEIPT PRINTERS ===
 permit tcp 192.168.10.0 0.0.0.255 192.168.40.0 0.0.0.255 eq 9100
 permit tcp 192.168.10.0 0.0.0.255 192.168.40.0 0.0.0.255 eq 515
 remark === PERMIT ENCRYPTED WAN PAYMENT GATEWAY EGRESS ===
 permit tcp 192.168.10.0 0.0.0.255 any eq 443
 remark === DENY POS ACCESS TO STAFF AND MANAGEMENT (PCI-DSS 1.3) ===
 deny   ip 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255 log
 deny   ip 192.168.10.0 0.0.0.255 192.168.99.0 0.0.0.255 log
 deny   ip any any log
!
! ACL 102: Filter incoming traffic from Staff Workstations (VLAN 20)
ip access-list extended ACL_STAFF_IN
 remark === STRICTLY BLOCK STAFF ACCESS TO POS ENVIRONMENT ===
 deny   ip 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255 log
 remark === PERMIT STAFF ACCESS TO DOMAIN SERVICES & FILE STORAGE ===
 permit ip 192.168.20.0 0.0.0.255 host 192.168.30.10
 permit tcp 192.168.20.0 0.0.0.255 host 192.168.30.12 eq 443
 permit tcp 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255 eq 9100
 permit tcp 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255 eq 515
 permit tcp 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255 eq 631
 remark === PERMIT OUTBOUND INTERNET ACCESS ===
 permit tcp 192.168.20.0 0.0.0.255 any eq 80
 permit tcp 192.168.20.0 0.0.0.255 any eq 443
 permit udp 192.168.20.0 0.0.0.255 any eq domain
 permit udp any eq bootpc any eq bootps
 permit icmp 192.168.20.0 0.0.0.255 any
 deny   ip any any log
!
! ACL 103: Filter incoming traffic from Network Printers (VLAN 40)
ip access-list extended ACL_PRINTER_IN
 remark === PRINTERS CANNOT INITIATE CONNECTIONS TO POS OR INTERNET ===
 deny   ip 192.168.40.0 0.0.0.255 192.168.10.0 0.0.0.255 log
 deny   ip 192.168.40.0 0.0.0.255 203.0.113.0 0.0.0.255 log
 deny   ip 192.168.40.0 0.0.0.255 any log-input
 permit udp 192.168.40.0 0.0.0.255 host 192.168.30.10 eq 123
 permit udp 192.168.40.0 0.0.0.255 host 192.168.30.10 eq 161
 permit udp 192.168.40.0 0.0.0.255 host 192.168.30.10 eq 162
 permit icmp 192.168.40.0 0.0.0.255 any echo-reply
 deny   ip any any
!
! ==============================================================================
! INTERFACE CONFIGURATION (ROUTER-ON-A-STICK & WAN)
! ==============================================================================
! Physical Trunk Port connecting to SW-CORE Gi0/1
interface GigabitEthernet0/0/0
 description 802.1Q Trunk Link to SW-CORE
 no ip address
 duplex auto
 speed auto
 no shutdown
!
interface GigabitEthernet0/0/0.10
 description Gateway for VLAN 10 [POS Terminals]
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip access-group ACL_POS_IN in
 ip nat inside
!
interface GigabitEthernet0/0/0.20
 description Gateway for VLAN 20 [Staff & Workstations]
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip access-group ACL_STAFF_IN in
 ip nat inside
!
interface GigabitEthernet0/0/0.30
 description Gateway for VLAN 30 [Server Farm DMZ]
 encapsulation dot1Q 30
 ip address 192.168.30.1 255.255.255.0
 ip nat inside
!
interface GigabitEthernet0/0/0.40
 description Gateway for VLAN 40 [Network Printers]
 encapsulation dot1Q 40
 ip address 192.168.40.1 255.255.255.0
 ip access-group ACL_PRINTER_IN in
 ip nat inside
!
interface GigabitEthernet0/0/0.99
 description Gateway for VLAN 99 [Management SVI]
 encapsulation dot1Q 99
 ip address 192.168.99.1 255.255.255.0
!
interface GigabitEthernet0/0/0.666
 description Native Blackhole VLAN - Untagged Traffic Drop
 encapsulation dot1Q 666 native
 no ip address
!
! WAN Interface connecting to simulated ISP
interface GigabitEthernet0/0/1
 description WAN Uplink to ISP Gateway
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 duplex auto
 speed auto
 no shutdown
!
! ==============================================================================
! NAT / PAT CONFIGURATION (Port Address Translation)
! ==============================================================================
! Standard ACL identifying internal subnets eligible for NAT
access-list 1 permit 192.168.10.0 0.0.0.255
access-list 1 permit 192.168.20.0 0.0.0.255
access-list 1 permit 192.168.30.0 0.0.0.255
!
! Dynamic Overload on WAN interface
ip nat inside source list 1 interface GigabitEthernet0/0/1 overload
!
! ==============================================================================
! ROUTING & DEFAULT GATEWAY
! ==============================================================================
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
! ==============================================================================
! DEVICE HARDENING & LINE ACCESS
! ==============================================================================
banner motd ^C
*******************************************************************************
* WARNING: AUTHORIZED ACCESS ONLY - RETAIL STORE NETWORK INFRASTRUCTURE       *
* All actions are monitored and logged. Unauthorized access is prohibited.    *
* SIMULATED LAB ENVIRONMENT - NOT FOR PRODUCTION DISCLOSURE                   *
*******************************************************************************
^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
 transport input none
!
line vty 0 4
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
