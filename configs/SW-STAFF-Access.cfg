! ==============================================================================
! RETAIL STORE NETWORK INFRASTRUCTURE SIMULATION
! DEVICE: SW-STAFF (Cisco Catalyst 2960-24TT Layer 2 Access Switch)
! ROLE: Access Switch for Back-Office Staff Workstations & Network Printers
! LOCATION: IDF 2 - Store Operations & Administration Office
! ==============================================================================

version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname SW-STAFF
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0  ! 'cisco123'
!
no ip domain-lookup
ip domain-name retail.internal
ip ssh version 2
!
username admin privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
! ==============================================================================
! VLAN DEFINITIONS
! ==============================================================================
vlan 20
 name STAFF-WORKSTATIONS
!
vlan 40
 name NETWORK-PRINTERS
!
vlan 99
 name MANAGEMENT-SVI
!
vlan 666
 name NATIVE-BLACKHOLE
!
! ==============================================================================
! ACCESS PORTS (STAFF WORKSTATIONS FA0/1 - FA0/12)
! ==============================================================================
interface range FastEthernet0/1 - 12
 description Staff Back-Office Workstation - VLAN 20
 switchport mode access
 switchport access vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
 duplex full
 speed 100
 no shutdown
!
! ==============================================================================
! ACCESS PORTS (NETWORK PRINTERS & SCANNERS FA0/13 - FA0/24)
! ==============================================================================
interface range FastEthernet0/13 - 24
 description Network Label & Receipt Printers - VLAN 40
 switchport mode access
 switchport access vlan 40
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable
 duplex full
 speed 100
 no shutdown
!
! ==============================================================================
! TRUNK UPLINK TO SW-CORE
! ==============================================================================
interface GigabitEthernet0/1
 description Uplink to SW-CORE [Gi0/3]
 switchport mode trunk
 switchport trunk native vlan 666
 switchport trunk allowed vlan 20,40,99
 switchport nonegotiate
 duplex full
 speed 1000
 no shutdown
!
interface GigabitEthernet0/2
 description UNUSED GIGABIT UPLINK
 switchport mode access
 switchport access vlan 666
 shutdown
!
! ==============================================================================
! SWITCH MANAGEMENT SVI
! ==============================================================================
interface Vlan99
 description SW-STAFF Management Interface
 ip address 192.168.99.4 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
! ==============================================================================
! BANNER & ACCESS LINES
! ==============================================================================
banner motd ^C
*******************************************************************************
* WARNING: AUTHORIZED ACCESS ONLY - RETAIL STAFF ACCESS SWITCH (SW-STAFF)     *
* All port transitions and security violations are logged to syslog.          *
*******************************************************************************
^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
 transport input none
!
line vty 0 4
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
