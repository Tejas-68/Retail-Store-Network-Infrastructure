! ==============================================================================
! RETAIL STORE NETWORK INFRASTRUCTURE SIMULATION
! DEVICE: SW-CORE (Cisco Catalyst 3560 / 3650 Distribution Switch)
! ROLE: Core / Distribution Layer, 802.1Q Aggregation, Rapid-PVST Root
! LOCATION: Main Distribution Frame (MDF) - Server Room Rack 1
! NOTICE: Fictional dummy parameters (RFC 1918). No company data disclosed.
! ==============================================================================

version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname SW-CORE
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0  ! 'cisco123'
!
no ip domain-lookup
ip domain-name retail.internal
ip ssh version 2
!
username admin privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
! ==============================================================================
! SPANNING TREE PROTOCOL (RAPID-PVST+ OPTIMIZATION)
! ==============================================================================
spanning-tree mode rapid-pvst
spanning-tree extend system-id
! SW-CORE is configured as Primary Root for all retail VLANs
spanning-tree vlan 10,20,30,40,99 root primary
!
! ==============================================================================
! VLAN DATABASE CONFIGURATION
! ==============================================================================
vlan 10
 name POS-TERMINALS
!
vlan 20
 name STAFF-WORKSTATIONS
!
vlan 30
 name SERVER-FARM
!
vlan 40
 name NETWORK-PRINTERS
!
vlan 99
 name MANAGEMENT-SVI
!
vlan 666
 name NATIVE-BLACKHOLE
!
! ==============================================================================
! TRUNK PORTS TO ROUTER & ACCESS SWITCHES (802.1Q)
! ==============================================================================
! Uplink to R1-EDGE Router (Router-on-a-Stick trunk)
interface GigabitEthernet0/1
 description Trunk to R1-EDGE [Gi0/0/0]
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 666
 switchport trunk allowed vlan 10,20,30,40,99
 switchport nonegotiate
 duplex full
 speed 1000
 no shutdown
!
! Downlink to SW-POS Access Switch
interface GigabitEthernet0/2
 description Trunk to SW-POS [Gi0/1]
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 666
 switchport trunk allowed vlan 10,99
 switchport nonegotiate
 duplex full
 speed 1000
 no shutdown
!
! Downlink to SW-STAFF Access Switch
interface GigabitEthernet0/3
 description Trunk to SW-STAFF [Gi0/1]
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 666
 switchport trunk allowed vlan 20,40,99
 switchport nonegotiate
 duplex full
 speed 1000
 no shutdown
!
! Downlink to SW-SERVER Access Switch
interface GigabitEthernet0/4
 description Trunk to SW-SERVER [Gi0/1]
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 666
 switchport trunk allowed vlan 30,99
 switchport nonegotiate
 duplex full
 speed 1000
 no shutdown
!
! ==============================================================================
! UNUSED PORTS HARDENING (SECURITY BEST PRACTICE)
! ==============================================================================
interface range GigabitEthernet0/5 - 24
 description UNUSED PORTS - DISABLED BY SECURITY POLICY
 switchport mode access
 switchport access vlan 666
 shutdown
!
! ==============================================================================
! SWITCH VIRTUAL INTERFACE (SVI) - OUT-OF-BAND MANAGEMENT
! ==============================================================================
interface Vlan99
 description SW-CORE Management Interface
 ip address 192.168.99.2 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
! ==============================================================================
! BANNER & MANAGEMENT SESSIONS
! ==============================================================================
banner motd ^C
*******************************************************************************
* WARNING: AUTHORIZED ACCESS ONLY - RETAIL CORE DISTRIBUTION SWITCH           *
* All configuration changes are audited and logged. Disconnect immediately.  *
* SIMULATED LAB ENVIRONMENT                                                   *
*******************************************************************************
^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
 transport input none
!
line vty 0 4
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
line vty 5 15
 transport input none
 shutdown
!
end
