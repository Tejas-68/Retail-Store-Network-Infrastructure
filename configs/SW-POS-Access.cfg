! ==============================================================================
! RETAIL STORE NETWORK INFRASTRUCTURE SIMULATION
! DEVICE: SW-POS (Cisco Catalyst 2960-24TT Layer 2 Access Switch)
! ROLE: Dedicated Access Switch for Cashier Counter & POS Terminals
! LOCATION: IDF 1 - Front Cashier Bank
! ==============================================================================

version 15.0
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname SW-POS
!
enable secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0  ! 'cisco123'
!
no ip domain-lookup
ip domain-name retail.internal
ip ssh version 2
!
username admin privilege 15 secret 5 $1$mERr$hx5rVt7rPNoS4wqbXKX7m0
!
! ==============================================================================
! VLAN DEFINITIONS
! ==============================================================================
vlan 10
 name POS-TERMINALS
!
vlan 99
 name MANAGEMENT-SVI
!
vlan 666
 name NATIVE-BLACKHOLE
!
! ==============================================================================
! ACCESS PORTS (POS TERMINALS 01 - 24) WITH PORT SECURITY & SPANNING-TREE
! ==============================================================================
interface range FastEthernet0/1 - 24
 description POS Register Connection - VLAN 10
 switchport mode access
 switchport access vlan 10
 ! Port Security to prevent unauthorized rogue devices or hub tapping
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 ! STP PortFast & BPDU Guard to protect spanning-tree topology
 spanning-tree portfast
 spanning-tree bpduguard enable
 duplex full
 speed 100
 no shutdown
!
! ==============================================================================
! TRUNK UPLINK TO SW-CORE
! ==============================================================================
interface GigabitEthernet0/1
 description Uplink to SW-CORE [Gi0/2]
 switchport mode trunk
 switchport trunk native vlan 666
 switchport trunk allowed vlan 10,99
 switchport nonegotiate
 duplex full
 speed 1000
 no shutdown
!
interface GigabitEthernet0/2
 description UNUSED GIGABIT UPLINK
 switchport mode access
 switchport access vlan 666
 shutdown
!
! ==============================================================================
! SWITCH MANAGEMENT SVI
! ==============================================================================
interface Vlan99
 description SW-POS Management Interface
 ip address 192.168.99.3 255.255.255.0
 no shutdown
!
ip default-gateway 192.168.99.1
!
! ==============================================================================
! BANNER & ACCESS LINES
! ==============================================================================
banner motd ^C
*******************************************************************************
* WARNING: AUTHORIZED ACCESS ONLY - RETAIL POS ACCESS SWITCH (SW-POS)         *
* PCI-DSS RESTRICTED ZONE. UNAUTHORIZED CONNECTIONS ARE SEVERELY AUDITED.     *
*******************************************************************************
^C
!
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
 transport input none
!
line vty 0 4
 exec-timeout 10 0
 logging synchronous
 login local
 transport input ssh
!
end
